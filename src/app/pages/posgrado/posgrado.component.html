<header class="top-header">
    <div class="header-left">
        <button (click)="toggleMenu()">☰</button>
        <img src="img/favicon-UNPA.ico" class="logo">
        <h2 class="titulo">Seguimiento de Egresados</h2>
    </div>

    <div class="user-info">
        <div class="notification-bell" (click)="irNotificaciones()">
            🔔
            <span class="notification-dot"></span>
        </div>

        <span class="username">{{ usuario }}</span>

        <div class="avatar" (click)="togglePopup($event)">
            {{ usuario.charAt(0) }}
        </div>
    </div>
</header>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" [class.hidden]="menuOculto">
        <nav>
            <a routerLink="/perfil">Mi perfil</a>
            <a routerLink="/contacto">Contacto</a>
            <a routerLink="/academico">Académico</a>
            <a routerLink="/posgrado" class="active">Posgrado</a>
            <a routerLink="/laboral">Laboral</a>
        </nav>
    </aside>

    <main class="main">

        <div class="section-header">
            <div class="section-title">
                <h2>Información de Posgrado</h2>
                <p>Registra estudios posteriores a tu licenciatura</p>
            </div>
        </div>

        <div class="card">

            <!-- 🔴 BOTÓN AÑADIR -->
            <div class="acciones-posgrado full" *ngIf="!mostrarPosgrado">
                <button type="button" class="btn-secundario" (click)="mostrarPosgrado = true">
                    + Añadir Posgrado
                </button>
            </div>

            <!-- 🔴 FORMULARIO -->
            <form class="form-grid" *ngIf="mostrarPosgrado">

                <!-- POSGRADO -->
                <div class="full">

                    <div class="bloque-formulario">
                        <h3>Formación de Posgrado</h3>

                        <div class="field-group">
                            <label>Nivel</label>
                            <select [(ngModel)]="form.nivel" name="nivel">
                                <option>Licenciatura</option>
                                <option>Maestria</option>
                                <option>Doctorado</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label>Institución</label>
                            <input [(ngModel)]="form.institucion" name="institucion">
                        </div>

                        <div class="field-group full">
                            <label>Programa</label>
                            <input [(ngModel)]="form.programa" name="programa">
                        </div>

                        <div class="field-group">
                            <label>Modalidad</label>
                            <select [(ngModel)]="form.modalidad" name="modalidad">
                                <option>Presencial</option>
                                <option>Virtual</option>
                                <option>Hibrido</option>
                            </select>
                        </div>
                    </div>

                    <div class="bloque-formulario">
                        <h3>Estado Académico</h3>

                        <div class="field-group">
                            <label>Estatus</label>
                            <select [(ngModel)]="form.estatus" name="estatus">
                                <option>En curso</option>
                                <option>Finalizado</option>
                                <option>Pausado</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label>Relación</label>
                            <select [(ngModel)]="form.relacion" name="relacion">
                                <option>Si</option>
                                <option>No</option>
                                <option>Un poco</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label>Inicio</label>
                            <input type="date" [(ngModel)]="form.inicio" name="inicio">
                        </div>

                        <div class="field-group">
                            <label>Fin</label>
                            <input type="date" [(ngModel)]="form.fin" name="fin">
                        </div>
                    </div>

                    <div class="bloque-formulario">
                        <h3>Apoyos</h3>

                        <div class="field-group">
                            <label>Beca</label>
                            <select [(ngModel)]="form.tieneBeca" name="tieneBeca">
                                <option [ngValue]="true">Sí</option>
                                <option [ngValue]="false">No</option>
                            </select>
                        </div>
                    </div>

                </div>

                <!-- BOTONES -->
                <div class="full">
                    <button type="button" (click)="guardar()" class="btn-guardar">
                        Guardar información
                    </button>

                    <button type="button" (click)="mostrarPosgrado = false" class="btn-secundario">
                        Cancelar
                    </button>
                </div>

                <!-- MENSAJE -->
                <div *ngIf="mensaje" class="save-msg">
                    {{ mensaje }}
                </div>

            </form>

        </div>

    </main>
</div>
