<div class="contacto-page">

  <header class="top-header">
    <div class="header-left">
      <button class="menu-btn" type="button" (click)="toggleMenu()">☰</button>
      <img src="favicon-UNPA.ico" class="logo" alt="UNPA">
      <h2 class="titulo">Seguimiento de Egresados</h2>
    </div>

    <div class="user-info">
      <span class="username">{{ nombreUsuario }}</span>
      <div class="avatar">{{ inicial }}</div>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" [class.oculto]="!menuAbierto">
      <nav>
        <a href="#">Mi perfil</a>
        <a class="active" href="#">Contacto</a>
        <a href="#">Académico</a>
        <a href="#">Laboral</a>
      </nav>
    </aside>

    <main class="main">

      <div class="section-header">
        <div class="section-title">
          <h2>Información de contacto</h2>
          <p>Mantén tus datos actualizados para recibir notificaciones</p>
        </div>
      </div>

      <div class="card">
        <form class="form-grid" (ngSubmit)="guardar()">

          <div class="field-group">
            <label for="correo">Correo personal</label>
            <input
              type="email"
              id="correo"
              name="correoPersonal"
              [(ngModel)]="contacto.correoPersonal"
              placeholder="correo@ejemplo.com"
              required>
          </div>

          <div class="field-group">
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              [(ngModel)]="contacto.telefono"
              placeholder="+52 000 000 0000">
          </div>

          <div class="field-group">
            <label for="ciudad">Ciudad</label>
            <input
              type="text"
              id="ciudad"
              name="ciudad"
              [(ngModel)]="contacto.ciudad"
              placeholder="Ciudad">
          </div>

          <div class="field-group">
            <label for="estado">Estado</label>
            <input
              type="text"
              id="estado"
              name="estadoResidencia"
              [(ngModel)]="contacto.estadoResidencia"
              placeholder="Estado">
          </div>

          <div class="field-group">
            <label for="instagram">Instagram</label>
            <input
              type="text"
              id="instagram"
              name="instagram"
              [(ngModel)]="contacto.instagram"
              placeholder="Ej. @usuario">
          </div>

          <div class="field-group">
            <label for="facebook">Facebook</label>
            <input
              type="text"
              id="facebook"
              name="facebook"
              [(ngModel)]="contacto.facebook"
              placeholder="Ej. Nombre Apellido">
          </div>

          <div *ngIf="mensajeExito || guardado" class="save-msg">
            ✓ Información guardada correctamente.
          </div>

          <button type="submit" class="btn-guardar">
            Guardar contacto
          </button>

        </form>
      </div>

    </main>

  </div>
</div>
