<div class="page-section">
  <div class="section-header">
    <div class="section-title">
      <h2>Información de contacto</h2>
      <p>Mantén tus datos actualizados para recibir notificaciones</p>
    </div>
  </div>

  <div class="form-card">
    <form class="contact-form" (ngSubmit)="guardar()">
      <h2>Datos de contacto</h2>
       <div *ngIf="mensajeError" class="error-msg">
           {{ mensajeError }}
       </div>
      <div class="field-group">
        <label for="correo"><i class="fas fa-envelope"></i>Correo personal</label>
        <input
          type="email"
          id="correo"
          name="correoPersonal"
          [(ngModel)]="contacto.correoPersonal"
          placeholder="Ej. correo@ejemplo.com"
          required>
      </div>

      <div class="field-group">
        <label for="telefono"><i class="fas fa-phone"></i>Teléfono</label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          [(ngModel)]="contacto.telefono"
          placeholder="Ej. 2871234567">
      </div>

      <div class="field-group">
        <label for="ciudad"><i class="fas fa-city"></i>Ciudad de residencia</label>
        <input
          type="text"
          id="ciudad"
          name="ciudad"
          [(ngModel)]="contacto.ciudad"
          placeholder="Ej. Tuxtepec">
      </div>

      <div class="field-group">
        <label for="estado"><i class="fas fa-map-marker-alt"></i>Estado de residencia</label>
        <input
          type="text"
          id="estado"
          name="estadoResidencia"
          [(ngModel)]="contacto.estadoResidencia"
          placeholder="Ej. Oaxaca">
      </div>

      <div class="field-group">
        <label for="instagram"><i class="fab fa-instagram"></i>Instagram</label>
        <input
          type="text"
          id="instagram"
          name="instagram"
          [(ngModel)]="contacto.instagram"
          placeholder="Ej. @valeria">
      </div>

      <div class="field-group">
        <label for="facebook"><i class="fab fa-facebook"></i>Facebook</label>
        <input
          type="text"
          id="facebook"
          name="facebook"
          [(ngModel)]="contacto.facebook"
          placeholder="Ej. Valeria Pérez">
      </div>

      <div *ngIf="mensajeExito" class="save-msg">
        ✓ Información guardada correctamente.
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-guardar">Guardar contacto</button>
      </div>
    </form>
