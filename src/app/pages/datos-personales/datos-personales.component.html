<div class="page-section">
  <div class="section-header">
    <div class="section-title">
      <h2>Editar perfil</h2>
      <p>Actualiza tu información personal</p>
    </div>
  </div>

  <div class="form-card">
    <form class="contact-form" (ngSubmit)="guardar()">
      <h2>Datos personales</h2>

      <div class="field-group">
        <label><i class="fas fa-user"></i>Nombre <span class="required">*</span></label>
        <input type="text" [(ngModel)]="form.nombre" name="nombre" required>
      </div>

      <div class="field-group">
        <label><i class="fas fa-user"></i>Apellido paterno <span class="required">*</span></label>
        <input type="text" [(ngModel)]="form.apellidoPaterno" name="apellidoPaterno" required>
      </div>

      <div class="field-group">
        <label><i class="fas fa-user"></i>Apellido materno</label>
        <input type="text" [(ngModel)]="form.apellidoMaterno" name="apellidoMaterno">
      </div>

      <div class="field-group">
        <label><i class="fas fa-university"></i>Campus</label>
        <select [(ngModel)]="form.campus" name="campus">
          <option value="">Selecciona</option>
          <option value="Loma Bonita">Loma Bonita</option>
          <option value="Tuxtepec">Tuxtepec</option>
        </select>
      </div>

      <div class="field-group">
        <label><i class="fas fa-calendar-alt"></i>Generación</label>
        <input type="text" [(ngModel)]="form.generacion" name="generacion" placeholder="Ej. 2020 - 2024">
      </div>

      <p *ngIf="mensaje" class="save-msg">{{ mensaje }}</p>

      <div class="acciones-form">
        <button type="submit" class="btn-guardar">Guardar</button>
        <button type="button" class="btn-secundario" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
