<div class="form-container">

  <h1>Editar perfil</h1>
  <p class="sub">Actualiza tu información personal</p>

  <form (ngSubmit)="guardar()">

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="form.nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label>Apellido paterno</label>
      <input type="text" [(ngModel)]="form.apellidoPaterno" name="apellidoPaterno" required>
    </div>

    <div class="form-group">
      <label>Apellido materno</label>
      <input type="text" [(ngModel)]="form.apellidoMaterno" name="apellidoMaterno">
    </div>

    <div class="form-group">
      <label>Campus</label>
      <select [(ngModel)]="form.campus" name="campus">
        <option value="">Selecciona</option>
        <option value="Loma Bonita">Loma Bonita</option>
        <option value="Tuxtepec">Tuxtepec</option>
      </select>
    </div>

    <div class="form-group">
      <label>Generación</label>
      <input type="text" [(ngModel)]="form.generacion" name="generacion" placeholder="Ej. 2020 - 2024">
    </div>

    <div class="botones">
      <button type="submit" class="btn-guardar">Guardar</button>
      <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
    </div>

  </form>

  <p class="mensaje">{{ mensaje }}</p>

</div>
