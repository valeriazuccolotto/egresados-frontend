<div class="pagina-individual">
  <div class="encabezado">
    <div>
      <h2><span class="material-icons">workspace_premium</span> Tipo de titulación</h2>
      <p>Modalidad con la que los egresados obtuvieron su título</p>
    </div>
    <div class="campus-box">
      <span class="material-icons">location_on</span>
      <select [(ngModel)]="campusSeleccionado" (change)="cambiar()">
        <option *ngFor="let c of campus">{{ c }}</option>
      </select>
    </div>
  </div>
  <div class="grafica-grande">
    <canvas id="chart"></canvas>
  </div>
</div>
