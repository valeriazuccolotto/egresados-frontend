<div class="page-section">
  <div class="section-header">
    <h1>Información académica</h1>
    <p>Mantén actualizados tus datos académicos y de titulación</p>
  </div>

  <div class="form-card">
    <form class="contact-form" (ngSubmit)="guardar()">
      <h2>Datos académicos</h2>

      <div class="field-group">
        <label for="matricula">Matrícula</label>
        <input
          type="text"
          id="matricula"
          name="matricula"
          [(ngModel)]="academico.matricula"
          placeholder="Ej. 22000001"
          required>
      </div>

      <div class="field-group">
        <label for="claveCarrera">Carrera</label>
        <select
          id="claveCarrera"
          name="claveCarrera"
          [(ngModel)]="academico.claveCarrera"
          required>
          <option value="">Selecciona una carrera</option>
          <option *ngFor="let carrera of carreras" [value]="carrera.claveCarrera">
            {{ carrera.nombreCarrera }}
          </option>
        </select>
      </div>

      <div class="field-group">
        <label for="promedio">Promedio</label>
        <input
          type="number"
          id="promedio"
          name="promedio"
          [(ngModel)]="academico.promedio"
          placeholder="Ej. 9.20"
          step="0.01"
          min="0"
          max="10"
          required>
      </div>

      <div class="field-group">
        <label for="anioEgreso">Año de egreso</label>
        <input
          type="number"
          id="anioEgreso"
          name="anioEgreso"
          [(ngModel)]="academico.anioEgreso"
          placeholder="Ej. 2024"
          required>
      </div>

      <div class="field-group">
        <label for="titulado">Titulado</label>
        <select
          id="titulado"
          name="titulado"
          [(ngModel)]="academico.titulado"
          required>
          <option value="No">No</option>
          <option value="Si">Sí</option>
        </select>
      </div>

      <div class="field-group">
        <label for="cedulaProfesional">Cédula profesional</label>
        <select
          id="cedulaProfesional"
          name="cedulaProfesional"
          [(ngModel)]="academico.cedulaProfesional"
          required>
          <option value="No">No</option>
          <option value="Si">Sí</option>
        </select>
      </div>

      <div *ngIf="academico.titulado === 'Si'" class="sub-section">
        <h2>Datos de titulación</h2>

        <div class="field-group">
          <label for="fechaTitulacion">Fecha de titulación</label>
          <input
            type="date"
            id="fechaTitulacion"
            name="fechaTitulacion"
            [(ngModel)]="academico.fechaTitulacion">
        </div>

        <div class="field-group">
          <label for="tipoTitulacion">Tipo de titulación</label>
          <select
            id="tipoTitulacion"
            name="tipoTitulacion"
            [(ngModel)]="academico.tipoTitulacion">
            <option value="">Selecciona una opción</option>
            <option value="Tesis">Tesis</option>
            <option value="Promedio">Promedio</option>
            <option value="CENEVAL">CENEVAL</option>
            <option value="Experiencia laboral">Experiencia laboral</option>
          </select>
        </div>

        <div *ngIf="academico.tipoTitulacion === 'Tesis'">
          <div class="field-group">
            <label for="nombreTesis">Nombre de tesis</label>
            <input
              type="text"
              id="nombreTesis"
              name="nombreTesis"
              [(ngModel)]="academico.nombreTesis"
              placeholder="Ej. Sistema de seguimiento de egresados">
          </div>

          <div class="field-group">
            <label for="director">Director</label>
            <input
              type="text"
              id="director"
              name="director"
              [(ngModel)]="academico.director"
              placeholder="Ej. Dr. Juan Pérez">
          </div>

          <div class="field-group">
            <label for="codirector">Codirector</label>
            <input
              type="text"
              id="codirector"
              name="codirector"
              [(ngModel)]="academico.codirector"
              placeholder="Ej. Dra. María López">
          </div>
        </div>

        <div *ngIf="academico.tipoTitulacion === 'CENEVAL'">
          <div class="field-group">
            <label for="fechaExamenCeneval">Fecha de examen</label>
            <input
              type="date"
              id="fechaExamenCeneval"
              name="fechaExamenCeneval"
              [(ngModel)]="academico.fechaExamen">
          </div>

          <div class="field-group">
            <label for="puntajeCeneval">Puntaje CENEVAL</label>
            <input
              type="number"
              id="puntajeCeneval"
              name="puntajeCeneval"
              [(ngModel)]="academico.puntajeCeneval"
              placeholder="Ej. 1100">
          </div>
        </div>

        <div *ngIf="academico.tipoTitulacion === 'Experiencia laboral'">
          <div class="field-group">
            <label for="tituloMemoria">Título de memoria</label>
            <input
              type="text"
              id="tituloMemoria"
              name="tituloMemoria"
              [(ngModel)]="academico.tituloMemoria"
              placeholder="Ej. Memoria de experiencia profesional">
          </div>

          <div class="field-group">
            <label for="asesor">Asesor</label>
            <input
              type="text"
              id="asesor"
              name="asesor"
              [(ngModel)]="academico.asesor"
              placeholder="Ej. Mtro. Carlos Ramírez">
          </div>

          <div class="field-group">
            <label for="fechaExamenMemoria">Fecha de examen</label>
            <input
              type="date"
              id="fechaExamenMemoria"
              name="fechaExamenMemoria"
              [(ngModel)]="academico.fechaExamen">
          </div>
        </div>
      </div>

      <div *ngIf="mensajeExito" class="save-msg">
        {{ mensajeExito }}
      </div>

      <div *ngIf="mensajeError" class="error-msg">
        {{ mensajeError }}
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-guardar">
          Guardar información académica
        </button>
      </div>
    </form>
  </div>
</div>
