<div class="section-header">
    <div class="section-title">
        <h2>Certificaciones</h2>
        <p>Registra tus certificaciones profesionales</p>
    </div>
</div>

<div class="card">

<form class="form-grid">

    <!-- BOTÓN -->
    <div class="acciones-posgrado full">
        <button type="button" class="btn-secundario" (click)="mostrarFormulario = true">
            + Agregar Certificación
        </button>
    </div>

    <!-- MENSAJE VACÍO -->
    <div class="estado-vacio full" *ngIf="!mostrarFormulario && historial.length === 0">
        No se han registrado certificaciones.
    </div>

    <!-- FORMULARIO CREAR -->
    <div *ngIf="mostrarFormulario" class="full">

        <div class="bloque-formulario">
            <h3>Certificación</h3>

            <div class="field-group">
                <label>Nombre de la certificación</label>
                <input [(ngModel)]="form.certNombre" name="certNombre">
            </div>

            <div class="field-group">
                <label>Fecha de inicio</label>
                <input type="date" [(ngModel)]="form.certInicio" name="certInicio">
            </div>

            <div class="field-group">
                <label>Fecha de término</label>
                <input type="date" [(ngModel)]="form.certFin" name="certFin">
            </div>

            <div class="field-group">
                <label>Fecha de obtención</label>
                <input type="date" [(ngModel)]="form.certObtencion" name="certObtencion">
            </div>

        </div>

        <div class="full">
            <button type="button" (click)="guardar()" class="btn-guardar">
                Guardar certificación
            </button>

            <button type="button" (click)="cancelarFormulario()" class="btn-secundario">
                Cancelar
            </button>
        </div>

    </div>

    <div *ngIf="mensaje" class="save-msg">
        {{ mensaje }}
    </div>

</form>

<!-- ================= HISTORIAL ================= -->
<div class="historial-grid" *ngIf="historial.length > 0">

    <ng-container *ngFor="let cert of historial">

        <!-- CARD -->
        <div class="historial-card">

            <div class="historial-header">
                <div>
                    <strong>{{ cert.nombreCertificacion }}</strong>
                </div>

                <span class="badge">{{ cert.fechaObtencion }}</span>
            </div>

            <div class="historial-body">
                <p>Inicio: {{ cert.fechaInicio }}</p>
                <p>Fin: {{ cert.fechaFin }}</p>
            </div>

            <div class="historial-actions">

                <button *ngIf="certSeleccionado?.idCertificacion !== cert.idCertificacion"
                        (click)="verDetalle(cert)"
                        class="btn-ver">
                    Ver
                </button>

                <button (click)="eliminarCertificacion(cert.idCertificacion)"
                        class="btn-eliminar">
                    Eliminar
                </button>

            </div>

        </div>

        <!-- DETALLE EDITABLE -->
        <div *ngIf="certSeleccionado?.idCertificacion === cert.idCertificacion"
            class="detalle-expandido">

            <form (ngSubmit)="actualizarCertificacion()" class="form-grid">

                <div class="bloque-formulario">
                    <h3>Editar certificación</h3>

                    <div class="field-group">
                        <label>Nombre</label>
                        <input [(ngModel)]="certSeleccionado.nombreCertificacion"
                                name="nombreCertificacion">
                    </div>

                    <div class="field-group">
                        <label>Fecha Inicio</label>
                        <input type="date"
                            [(ngModel)]="certSeleccionado.fechaInicio"
                            name="fechaInicio">
                    </div>

                    <div class="field-group">
                        <label>Fecha Fin</label>
                        <input type="date"
                            [(ngModel)]="certSeleccionado.fechaFin"
                            name="fechaFin">
                    </div>

                    <div class="field-group">
                        <label>Fecha de obtención</label>
                        <input type="date"
                            [(ngModel)]="certSeleccionado.fechaObtencion"
                            name="fechaObtencion">
                    </div>
                </div>

                <div class="acciones-detalle">
                    <button type="submit" class="btn-guardar">
                        Guardar cambios
                    </button>

                    <button type="button"
                            (click)="cancelarEdicion()"
                            class="btn-secundario">
                        Cancelar
                    </button>
                </div>

            </form>

        </div>

    </ng-container>

</div>

</div>
