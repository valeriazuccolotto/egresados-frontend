<!-- LOGIN SIN TOPBAR NI SIDEBAR -->
<router-outlet *ngIf="esLogin || esAdmin"></router-outlet>

<div class="app-shell" *ngIf="!esLogin && !esAdmin">

  <!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-left">

    <button class="menu-button" type="button" (click)="toggleSidebar()">
      <span class="material-icons">menu</span>
    </button>

    <div class="brand">
      <img src="img/logo.png" alt="UNPA" class="brand-logo" />
      <span class="brand-title">Seguimiento de Egresados</span>
    </div>

  </div>

  <div class="topbar-right">
    <span class="bell">🔔</span>

    <div class="progress-card">
      <span class="progress-text">{{ porcentajePerfil }}%</span>

      <div class="progress-lines">
        <div class="progress-line small">
          <span [style.width.%]="porcentajePerfil"></span>
        </div>

    <div class="progress-line large">
      <span [style.width.%]="porcentajePerfil"></span>
    </div>
  </div>
</div>

      <div class="user-menu" #photoMenuRoot>
        <div class="avatar" (click)="togglePhotoMenu()">
          <img [src]="fotoGlobal" class="avatar-img" />
        </div>

        <span class="user-name"></span>
        <span class="arrow"></span>

        <div class="foto-panel" *ngIf="mostrarPanelFoto">
          <h3>Cambiar foto de perfil</h3>

          <button type="button" class="photo-option" (click)="openCameraPicker()">
            📸 Tomar foto
          </button>

          <button type="button" class="photo-option" (click)="openGalleryPicker()">
            🖼 Seleccionar imagen
          </button>

          <p>JPG, PNG o WEBP • Máximo 5MB</p>
        </div>

        <input
          #galleryInput
          type="file"
          accept="image/png, image/jpeg, image/webp"
          hidden
          (change)="seleccionarFoto($event)"
        />

        <input
          #cameraInput
          type="file"
          accept="image/*"
          capture="user"
          hidden
          (change)="seleccionarFoto($event)"
        />
      </div>
    </div>
  </header>

  <!-- BODY -->
  <div class="app-body">

    <!-- SIDEBAR -->
<aside class="sidebar" [class.closed]="sidebarHidden">
    <nav class="sidebar-menu">

   <a routerLink="/perfil" routerLinkActive="active" class="menu-item">
  <span class="material-icons">person</span>
  Mi perfil
</a>

<a routerLink="/contacto" routerLinkActive="active" class="menu-item">
  <span class="material-icons">call</span>
  Contacto
</a>

<a routerLink="/academico" routerLinkActive="active" class="menu-item">
  <span class="material-icons">school</span>
  Académico
</a>

<a routerLink="/posgrado" routerLinkActive="active" class="menu-item">
  <span class="material-icons">menu_book</span>
  Posgrado
</a>

<a routerLink="/laboral" routerLinkActive="active" class="menu-item">
  <span class="material-icons">work</span>
  Laboral
</a>

<a routerLink="/certificaciones" routerLinkActive="active" class="menu-item">
  <span class="material-icons">verified</span>
  Certificaciones
</a>

<a routerLink="/reconocimientos" routerLinkActive="active" class="menu-item">
  <span class="material-icons">emoji_events</span>
  Reconocimientos
</a>

  </nav>
</aside>

    <!-- CONTENIDO -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- MODAL CÁMARA -->
  <div class="camera-modal" *ngIf="cameraModalOpen">
    <div class="camera-box">

      <h3>Tomar foto</h3>

      <video
        #cameraVideo
        class="camera-video"
        autoplay
        muted
        playsinline
        *ngIf="!cameraCapturedPreview"
      ></video>

      <img
        *ngIf="cameraCapturedPreview"
        [src]="cameraCapturedPreview"
        class="camera-preview"
      />

      <p class="camera-error" *ngIf="cameraError">
        {{ cameraError }}
      </p>

      <div class="camera-actions" *ngIf="!cameraCapturedPreview">
        <button type="button" (click)="captureFromCamera()">Capturar</button>
        <button type="button" (click)="closeCameraModal()">Cancelar</button>
      </div>

      <div class="camera-actions" *ngIf="cameraCapturedPreview">
        <button type="button" (click)="confirmCapturedPhoto()">Usar foto</button>
        <button type="button" (click)="retakeCameraPhoto()">Repetir</button>
        <button type="button" (click)="closeCameraModal()">Cancelar</button>
      </div>

    </div>
  </div>
</div>
