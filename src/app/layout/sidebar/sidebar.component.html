<aside class="sidebar" [class.oculto]="!abierto">
  <nav>

    <a routerLink="/dashboard" routerLinkActive="activo">
      <span class="material-icons">dashboard</span>
      Dashboard
    </a>

    <a routerLink="/datos-recuperados" routerLinkActive="activo">
      <span class="material-icons">assignment</span>
      Datos recuperados
    </a>

    <a routerLink="/empresas" routerLinkActive="activo">
      <span class="material-icons">business</span>
      Empresas
    </a>

    <!-- REPORTES CON SUBMENÚ -->
    <div class="menu-item" [class.abierto]="reportesAbierto" (click)="toggleReportes()">
      <span class="material-icons">bar_chart</span>
      Reportes
      <span class="material-icons flecha">expand_more</span>
    </div>

    <div class="submenu" [class.visible]="reportesAbierto">
      <a routerLink="/reportes/laboral" routerLinkActive="activo">
        <span class="material-icons">work</span>
        Laboral
      </a>
      <a routerLink="/reportes/academico" routerLinkActive="activo">
        <span class="material-icons">school</span>
        Académico
      </a>
      <a routerLink="/reportes/posgrado" routerLinkActive="activo">
        <span class="material-icons">menu_book</span>
        Posgrado
      </a>
      <a routerLink="/reportes/reconocimientos" routerLinkActive="activo">
        <span class="material-icons">emoji_events</span>
        Reconocimientos
      </a>
    </div>

    <a routerLink="/usuarios" routerLinkActive="activo">
      <span class="material-icons">people</span>
      Usuarios
    </a>

  </nav>
</aside>
